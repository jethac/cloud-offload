[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-offload"
version = "0.2.1"
description = "Provider-neutral cloud offload coordinator for ComfyUI workflows and partitions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jetha Chan" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "huggingface_hub>=0.23",
    # Provider, Hugging Face, and RunPod S3 credentials are stored through the
    # operating-system credential manager. credentials.py already treats this
    # as required at runtime; declare it so installed coordinators can actually
    # read what the settings API saved.
    "keyring>=24",
]

[project.optional-dependencies]
# Extras needed inside a runner image (torch is supplied by the base image).
cloud = [
    "aiohttp>=3.9",
    "safetensors>=0.4",
    # hf_transfer backs the HF_HUB_ENABLE_HF_TRANSFER=1 the runner image sets.
    "hf_transfer>=0.1",
]
gcs = ["google-cloud-storage>=2.10"]
s3 = ["boto3>=1.28"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
cloud-offload = "cloud_offload.__main__:main"

[project.urls]
Homepage = "https://github.com/jethac/cloud-offload"

[tool.setuptools.packages.find]
include = ["cloud_offload*"]

# Declarative provider specs ship with the package: without this they would be
# missing from wheels and providers served declaratively would silently vanish.
[tool.setuptools.package-data]
"cloud_offload.providers.specs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
